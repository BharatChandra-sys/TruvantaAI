<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none" role="img" aria-label="Truvanta architecture: input and claim intake feed three parallel lanes (own ML models, memory and RAG retrieval, live evidence), which combine in grounded reasoning and a calibrated decision model, producing the live card, a memory write and monitoring signals.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { fill: #6b6b73; font-size: 11px; letter-spacing: .06em; }
    .t  { fill: #ededef; font-size: 13px; }
    .t2 { fill: #a1a1aa; font-size: 12.5px; }
    .m  { fill: #6b6b73; font-size: 11px; }
    .box  { fill: #17171a; stroke: #ffffff; stroke-opacity: .08; }
    .row  { fill: #0a0a0b; fill-opacity: .55; }
    .chip { fill: #1f1f23; }

    .flow { stroke: #ffffff; stroke-opacity: .18; stroke-width: 1.5; stroke-dasharray: 3 9; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }

    /* stages light up in order, on a 7 s loop */
    .glow { stroke: #ffc53d; stroke-opacity: 0; animation: glow 7s cubic-bezier(.23,1,.32,1) infinite; }
    .g1 { animation-delay: 0s; }   .g2 { animation-delay: .5s; }  .g3 { animation-delay: 1.0s; }
    .g4 { animation-delay: 1.0s; } .g5 { animation-delay: 1.0s; } .g6 { animation-delay: 2.2s; }
    .g7 { animation-delay: 2.8s; } .g8 { animation-delay: 3.5s; } .g9 { animation-delay: 3.5s; } .g10 { animation-delay: 3.5s; }
    @keyframes glow { 0% { stroke-opacity: 0; } 6% { stroke-opacity: .55; } 22% { stroke-opacity: .55; } 34%, 100% { stroke-opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } }
  </style>

  <rect width="1200" height="720" rx="24" fill="#0a0a0b"/>
  <rect x=".5" y=".5" width="1199" height="719" rx="23.5" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- connectors -->
  <g>
    <path class="flow" d="M380 105 H420"/>
    <path class="flow" d="M790 140 C790 160 220 160 220 180"/>
    <path class="flow" d="M790 140 V180"/>
    <path class="flow" d="M790 140 C790 160 980 160 980 180"/>
    <path class="flow" d="M220 430 C220 450 320 450 320 470"/>
    <path class="flow" d="M600 430 C600 450 480 450 480 470"/>
    <path class="flow" d="M980 430 C980 450 560 450 560 470"/>
    <path class="flow" d="M600 513 H620"/>
    <path class="flow" d="M890 556 C890 576 220 576 220 596"/>
    <path class="flow" d="M890 556 C890 576 600 576 600 596"/>
    <path class="flow" d="M890 556 V596"/>
  </g>

  <!-- 1. input -->
  <rect class="box" x="40" y="70" width="340" height="70" rx="14"/>
  <rect class="glow g1" x="40.5" y="70.5" width="339" height="69" rx="13.5"/>
  <text class="label mono" x="58" y="94">INPUT</text>
  <rect class="chip" x="58" y="106" width="78" height="22" rx="11"/><text class="t" x="97" y="121" text-anchor="middle" font-size="11.5">Selection</text>
  <rect class="chip" x="142" y="106" width="50" height="22" rx="11"/><text class="t" x="167" y="121" text-anchor="middle" font-size="11.5">Page</text>
  <rect class="chip" x="198" y="106" width="48" height="22" rx="11"/><text class="t" x="222" y="121" text-anchor="middle" font-size="11.5">Chat</text>
  <rect class="chip" x="252" y="106" width="54" height="22" rx="11"/><text class="t" x="279" y="121" text-anchor="middle" font-size="11.5">Image</text>
  <rect class="chip" x="312" y="106" width="52" height="22" rx="11"/><text class="t" x="338" y="121" text-anchor="middle" font-size="11.5">Voice</text>

  <!-- 2. intake -->
  <rect class="box" x="420" y="70" width="740" height="70" rx="14"/>
  <rect class="glow g2" x="420.5" y="70.5" width="739" height="69" rx="13.5"/>
  <text class="label mono" x="438" y="94">CLAIM INTAKE</text>
  <text class="t2" x="438" y="122">Language detection and translation  &#183;  atomic claim extraction  &#183;  key terms (names, codes, numbers, quotes)</text>

  <!-- 3a. own models -->
  <rect class="box" x="40" y="180" width="360" height="250" rx="14"/>
  <rect class="glow g3" x="40.5" y="180.5" width="359" height="249" rx="13.5"/>
  <text class="label mono" x="58" y="206">OWN MODELS</text>
  <rect class="row" x="56" y="220" width="328" height="32" rx="8"/><text class="t" x="70" y="241">DeBERTa-v3 classifier</text><text class="m mono" x="372" y="241" text-anchor="end">96.6%</text>
  <rect class="row" x="56" y="258" width="328" height="32" rx="8"/><text class="t" x="70" y="279">RoBERTa model-a</text><text class="m mono" x="372" y="279" text-anchor="end">96.3%</text>
  <rect class="row" x="56" y="296" width="328" height="32" rx="8"/><text class="t" x="70" y="317">RoBERTa ensemble a + b</text><text class="m mono" x="372" y="317" text-anchor="end">0.6 / 0.4</text>
  <rect class="row" x="56" y="334" width="328" height="32" rx="8"/><text class="t" x="70" y="355">TF-IDF + logistic regression</text><text class="m mono" x="372" y="355" text-anchor="end">~50 ms</text>
  <rect class="row" x="56" y="372" width="328" height="32" rx="8"/><text class="t" x="70" y="393">Manipulation, SHAP, attention</text><text class="m mono" x="372" y="393" text-anchor="end">explain</text>

  <!-- 3b. memory / RAG -->
  <rect class="box" x="420" y="180" width="360" height="250" rx="14"/>
  <rect class="glow g4" x="420.5" y="180.5" width="359" height="249" rx="13.5"/>
  <text class="label mono" x="438" y="206">MEMORY  &#183;  RAG RETRIEVAL</text>
  <rect class="row" x="436" y="220" width="328" height="32" rx="8"/><text class="t" x="450" y="241">MiniLM sentence embeddings</text><text class="m mono" x="752" y="241" text-anchor="end">384-d</text>
  <rect class="row" x="436" y="258" width="328" height="32" rx="8"/><text class="t" x="450" y="279">pgvector cosine search</text><text class="m mono" x="752" y="279" text-anchor="end">semantic</text>
  <rect class="row" x="436" y="296" width="328" height="32" rx="8"/><text class="t" x="450" y="317">BM25 full-text search</text><text class="m mono" x="752" y="317" text-anchor="end">lexical</text>
  <rect class="row" x="436" y="334" width="328" height="32" rx="8"/><text class="t" x="450" y="355">Reciprocal rank fusion</text><text class="m mono" x="752" y="355" text-anchor="end">hybrid</text>
  <rect class="row" x="436" y="372" width="328" height="32" rx="8"/><text class="t" x="450" y="393">Cross-encoder rerank</text><text class="m mono" x="752" y="393" text-anchor="end">ms-marco</text>

  <!-- 3c. live evidence -->
  <rect class="box" x="800" y="180" width="360" height="250" rx="14"/>
  <rect class="glow g5" x="800.5" y="180.5" width="359" height="249" rx="13.5"/>
  <text class="label mono" x="818" y="206">LIVE EVIDENCE  &#183;  PARALLEL, 3.5 S CAP</text>
  <rect class="row" x="816" y="220" width="328" height="32" rx="8"/><text class="t" x="830" y="241">Published fact-checks</text><text class="m mono" x="1132" y="241" text-anchor="end">ClaimReview</text>
  <rect class="row" x="816" y="258" width="328" height="32" rx="8"/><text class="t" x="830" y="279">Google News  &#183;  Bing News</text><text class="m mono" x="1132" y="279" text-anchor="end">recent</text>
  <rect class="row" x="816" y="296" width="328" height="32" rx="8"/><text class="t" x="830" y="317">Wikipedia  &#183;  PubMed</text><text class="m mono" x="1132" y="317" text-anchor="end">reference</text>
  <rect class="row" x="816" y="334" width="328" height="32" rx="8"/><text class="t" x="830" y="355">Web search</text><text class="m mono" x="1132" y="355" text-anchor="end">low trust</text>
  <rect class="row" x="816" y="372" width="328" height="32" rx="8"/><text class="t" x="830" y="393">Scrape matching paragraphs</text><text class="m mono" x="1132" y="393" text-anchor="end">top pages</text>

  <!-- 4. reasoning + decision -->
  <rect class="box" x="40" y="470" width="560" height="86" rx="14"/>
  <rect class="glow g6" x="40.5" y="470.5" width="559" height="85" rx="13.5"/>
  <text class="label mono" x="58" y="494">GROUNDED REASONING</text>
  <text class="t2" x="58" y="518">A language model reads only the retrieved passages and cites each as [n].</text>
  <text class="t2" x="58" y="538">Citation validator  &#183;  self-healing model registry (Groq, Gemini, OpenRouter)</text>

  <rect class="box" x="620" y="470" width="540" height="86" rx="14"/>
  <rect class="glow g7" x="620.5" y="470.5" width="539" height="85" rx="13.5"/>
  <text class="label mono" x="638" y="494">DECISION</text>
  <text class="t2" x="638" y="518">Calibrated meta-model fuses ML, AI, evidence and manipulation scores.</text>
  <text class="t2" x="638" y="538">Conflicting or missing evidence returns Uncertain  &#183;  fact-check override</text>

  <!-- 5. outputs -->
  <rect class="box" x="40" y="596" width="360" height="84" rx="14"/>
  <rect class="glow g8" x="40.5" y="596.5" width="359" height="83" rx="13.5"/>
  <text class="label mono" x="58" y="620">LIVE CARD</text>
  <text class="t2" x="58" y="644">Streamed over SSE: sources, early</text>
  <text class="t2" x="58" y="663">fact-check match, then the verdict</text>

  <rect class="box" x="420" y="596" width="360" height="84" rx="14"/>
  <rect class="glow g9" x="420.5" y="596.5" width="359" height="83" rx="13.5"/>
  <text class="label mono" x="438" y="620">MEMORY WRITE</text>
  <text class="t2" x="438" y="644">Embedded into pgvector as VERIFIED,</text>
  <text class="t2" x="438" y="663">MODEL_ONLY or DISPUTED for future checks</text>

  <rect class="box" x="800" y="596" width="360" height="84" rx="14"/>
  <rect class="glow g10" x="800.5" y="596.5" width="359" height="83" rx="13.5"/>
  <text class="label mono" x="818" y="620">MONITORING AND LEARNING</text>
  <text class="t2" x="818" y="644">Drift, velocity, clustering, cooldown,</text>
  <text class="t2" x="818" y="663">source credibility, automatic retraining</text>

  <text class="m mono" x="40" y="706">first source ~0.5 s  &#183;  fact-check match ~1 s  &#183;  verdict 3&#8211;5 s  &#183;  repeat checks instant</text>
</svg>
