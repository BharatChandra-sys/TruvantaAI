<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none" role="img" aria-label="Complete Truvanta Architecture: ML models, pgvector memory with hybrid retrieval, RAG with citation validation, and LangGraph orchestration">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 18px; font-weight: 600; fill: #ededef; }
    .subtitle { font-size: 11px; fill: #6b6b73; }
    .label { font-size: 12px; fill: #ededef; }
    .small { font-size: 10.5px; fill: #9a9a9f; }
    
    .flow { stroke: #ffffff; stroke-opacity: .16; stroke-width: 1.5; fill: none; }
    .flowAnim { stroke: #ffc53d; stroke-width: 1.5; stroke-dasharray: 4 8; animation: flow 2s linear infinite; fill: none; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    
    .phase { animation: phase 12s ease-in-out infinite; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 2s; }
    .p3 { animation-delay: 4s; }
    .p4 { animation-delay: 6s; }
    @keyframes phase { 
      0%, 15% { stroke-opacity: .5; fill-opacity: .12; } 
      25%, 100% { stroke-opacity: .08; fill-opacity: .04; } 
    }
    
    @media (prefers-reduced-motion: reduce) {
      .flowAnim, .phase { animation: none; }
    }
  </style>

  <!-- Background -->
  <rect width="1400" height="900" rx="24" fill="#0a0a0b"/>
  <rect x=".5" y=".5" width="1399" height="899" rx="23.5" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="title">TruvantaAI Complete Architecture</text>
  <text x="700" y="58" text-anchor="middle" class="subtitle">ML Models • pgvector Memory • Hybrid Retrieval • RAG • LangGraph Orchestration</text>

  <!-- ============ INPUT LAYER ============ -->
  <g id="input">
    <rect x="600" y="90" width="200" height="70" rx="12" fill="#17171a" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="700" y="115" text-anchor="middle" class="label" font-weight="500">USER CLAIM</text>
    <text x="700" y="135" text-anchor="middle" class="small">"5G towers spread coronavirus"</text>
  </g>

  <!-- Arrow down -->
  <path class="flow" d="M700 160 V190"/>
  <path class="flowAnim" d="M700 160 V190"/>

  <!-- ============ NORMALIZATION ============ -->
  <g id="normalize">
    <rect x="600" y="190" width="200" height="60" rx="10" fill="#1a1a1f" stroke="#4f46e5" stroke-opacity=".3"/>
    <text x="700" y="215" text-anchor="middle" class="label">1. Normalize Claim</text>
    <text x="700" y="235" text-anchor="middle" class="small">Multilingual • Entity extraction</text>
  </g>

  <!-- Split into 3 parallel lanes -->
  <path class="flow" d="M700 250 V270"/>
  <path class="flowAnim" d="M700 250 V270"/>
  
  <path class="flow" d="M700 270 L300 300"/>
  <path class="flow" d="M700 270 L700 300"/>
  <path class="flow" d="M700 270 L1100 300"/>
  <path class="flowAnim" d="M700 270 L300 300"/>
  <path class="flowAnim" d="M700 270 L700 300"/>
  <path class="flowAnim" d="M700 270 L1100 300"/>

  <!-- ============ LEFT LANE: OWN ML MODELS ============ -->
  <g id="ml-lane">
    <rect class="phase p1" x="40" y="300" width="520" height="280" rx="16" fill="#1a1a1f" stroke="#10b981"/>
    <text x="60" y="330" class="label" font-weight="600">OWN ML MODELS (4-Level Fallback)</text>
    
    <!-- Level 1: Cache -->
    <rect x="60" y="350" width="480" height="40" rx="8" fill="#17171a" stroke="#6b6b73" stroke-opacity=".2"/>
    <text x="80" y="375" class="label">Level 1: Redis Cache</text>
    <text x="520" y="375" text-anchor="end" class="small">instant • in-memory fallback</text>
    
    <!-- Level 2: DeBERTa -->
    <rect x="60" y="400" width="480" height="40" rx="8" fill="#17171a" stroke="#10b981" stroke-opacity=".3"/>
    <text x="80" y="425" class="label">Level 2: DeBERTa (Oracle Cloud)</text>
    <text x="520" y="425" text-anchor="end" class="small">96.6% accuracy • 1-2s</text>
    
    <!-- Level 3: Ensemble -->
    <rect x="60" y="450" width="480" height="40" rx="8" fill="#17171a" stroke="#10b981" stroke-opacity=".3"/>
    <text x="80" y="475" class="label">Level 3: RoBERTa Ensemble (HF Space)</text>
    <text x="520" y="475" text-anchor="end" class="small">Model A 96.3% + Model B 79.8%</text>
    
    <!-- Level 4: TF-IDF -->
    <rect x="60" y="500" width="480" height="40" rx="8" fill="#17171a" stroke="#10b981" stroke-opacity=".3"/>
    <text x="80" y="525" class="label">Level 4: TF-IDF + Logistic Regression</text>
    <text x="520" y="525" text-anchor="end" class="small">94.2% on ISOT • 50ms • always available</text>
    
    <!-- Output -->
    <rect x="200" y="550" width="200" height="20" rx="6" fill="#10b981" fill-opacity=".15"/>
    <text x="300" y="565" text-anchor="middle" class="small" fill="#10b981">ML Score: 0.81 (fake)</text>
  </g>

  <!-- ============ MIDDLE LANE: MEMORY + RAG ============ -->
  <g id="memory-lane">
    <rect class="phase p2" x="590" y="300" width="220" height="280" rx="16" fill="#1a1a1f" stroke="#f59e0b"/>
    <text x="610" y="330" class="label" font-weight="600">MEMORY + RAG</text>
    
    <!-- pgvector Memory -->
    <rect x="610" y="350" width="180" height="80" rx="8" fill="#17171a" stroke="#f59e0b" stroke-opacity=".3"/>
    <text x="620" y="370" class="small" font-weight="500">pgvector (Neon)</text>
    <text x="620" y="388" class="small">• fact_checks (384-dim)</text>
    <text x="620" y="404" class="small">• evidence_documents</text>
    <text x="620" y="420" class="small">• VERIFIED / DISPUTED</text>
    
    <!-- Hybrid Retrieval -->
    <rect x="610" y="440" width="180" height="50" rx="8" fill="#17171a" stroke="#f59e0b" stroke-opacity=".3"/>
    <text x="620" y="460" class="small" font-weight="500">Hybrid Retrieval</text>
    <text x="620" y="476" class="small">BM25 + Vector → RRF</text>
    
    <!-- Cross-encoder Rerank -->
    <rect x="610" y="500" width="180" height="40" rx="8" fill="#17171a" stroke="#f59e0b" stroke-opacity=".3"/>
    <text x="620" y="525" class="small">Cross-encoder rerank</text>
    
    <!-- Output -->
    <rect x="620" y="550" width="160" height="20" rx="6" fill="#f59e0b" fill-opacity=".15"/>
    <text x="700" y="565" text-anchor="middle" class="small" fill="#f59e0b">5 similar claims</text>
  </g>

  <!-- ============ RIGHT LANE: LIVE EVIDENCE ============ -->
  <g id="evidence-lane">
    <rect class="phase p3" x="840" y="300" width="520" height="280" rx="16" fill="#1a1a1f" stroke="#3b82f6"/>
    <text x="860" y="330" class="label" font-weight="600">LIVE EVIDENCE SEARCH</text>
    
    <!-- Sources grid -->
    <rect x="860" y="350" width="150" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="870" y="372" class="small">Google Fact Check</text>
    
    <rect x="1020" y="350" width="150" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="1030" y="372" class="small">Google News</text>
    
    <rect x="1180" y="350" width="150" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="1190" y="372" class="small">Bing News</text>
    
    <rect x="860" y="395" width="150" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="870" y="417" class="small">Wikipedia</text>
    
    <rect x="1020" y="395" width="150" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="1030" y="417" class="small">PubMed</text>
    
    <rect x="1180" y="395" width="150" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="1190" y="417" class="small">DuckDuckGo</text>
    
    <!-- Scraping & Ranking -->
    <rect x="860" y="440" width="470" height="45" rx="8" fill="#17171a" stroke="#3b82f6" stroke-opacity=".3"/>
    <text x="870" y="465" class="small">Parallel scraping • Paragraph extraction • Source ranking by trust tier</text>
    
    <!-- Publisher Bias -->
    <rect x="860" y="495" width="230" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="870" y="517" class="small">Publisher bias (100+ outlets)</text>
    
    <rect x="1100" y="495" width="230" height="35" rx="6" fill="#17171a" stroke="#3b82f6" stroke-opacity=".2"/>
    <text x="1110" y="517" class="small">Credibility scoring</text>
    
    <!-- Output -->
    <rect x="960" y="550" width="280" height="20" rx="6" fill="#3b82f6" fill-opacity=".15"/>
    <text x="1100" y="565" text-anchor="middle" class="small" fill="#3b82f6">8 evidence articles (balanced: support + contradict)</text>
  </g>

  <!-- Merge signals -->
  <path class="flow" d="M300 580 L700 620"/>
  <path class="flow" d="M700 580 V620"/>
  <path class="flow" d="M1100 580 L700 620"/>
  <path class="flowAnim" d="M300 580 L700 620"/>
  <path class="flowAnim" d="M700 580 V620"/>
  <path class="flowAnim" d="M1100 580 L700 620"/>

  <!-- ============ RAG REASONING ============ -->
  <g id="rag">
    <rect class="phase p4" x="500" y="620" width="400" height="80" rx="12" fill="#1a1a1f" stroke="#a855f7" stroke-opacity=".5"/>
    <text x="700" y="645" text-anchor="middle" class="label" font-weight="600">2. RAG Reasoner</text>
    <text x="700" y="665" text-anchor="middle" class="small">LLM reads retrieved context • Structured output • Citation validator</text>
    <text x="700" y="685" text-anchor="middle" class="small">Assessment: CONTRADICTED • Citations: [1][2][3] checked against sources</text>
  </g>

  <path class="flow" d="M700 700 V720"/>
  <path class="flowAnim" d="M700 700 V720"/>

  <!-- ============ ANALYSIS MODULES ============ -->
  <g id="analysis">
    <rect x="200" y="720" width="1000" height="70" rx="12" fill="#17171a" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="700" y="745" text-anchor="middle" class="label" font-weight="600">3. Analysis Modules (30+ components)</text>
    <text x="220" y="768" class="small">• Manipulation detection (conspiracy/emotional)</text>
    <text x="520" y="768" class="small">• Velocity tracking (viral spread)</text>
    <text x="220" y="783" class="small">• Drift detection (distribution shift)</text>
    <text x="520" y="783" class="small">• Semantic clustering (paraphrases)</text>
    <text x="840" y="768" class="small">• Credibility scoring</text>
    <text x="840" y="783" class="small">• Domain classification</text>
    <text x="1050" y="768" class="small">• Social graph</text>
    <text x="1050" y="783" class="small">• AB testing</text>
  </g>

  <path class="flow" d="M700 790 V810"/>
  <path class="flowAnim" d="M700 790 V810"/>

  <!-- ============ META DECISION ============ -->
  <g id="decision">
    <rect x="500" y="810" width="400" height="60" rx="12" fill="#1a1a1f" stroke="#ef4444" stroke-opacity=".5"/>
    <text x="700" y="835" text-anchor="middle" class="label" font-weight="600">4. Meta-Decision Engine</text>
    <text x="700" y="855" text-anchor="middle" class="small">Calibrated LR: ML (12%) + AI (55%) + Evidence (25%) + Manipulation (8%)</text>
  </g>

  <path class="flow" d="M700 870 V890"/>
  <path class="flow" d="M700 890 L300 890 L300 830"/>
  <path class="flow" d="M700 890 L1100 890 L1100 830"/>
  <path class="flowAnim" d="M700 870 V890"/>
  <path class="flowAnim" d="M700 890 L300 890 L300 830"/>
  <path class="flowAnim" d="M700 890 L1100 890 L1100 830"/>

  <!-- ============ OUTPUTS ============ -->
  <g id="outputs">
    <!-- Memory Write -->
    <rect x="50" y="770" width="200" height="60" rx="10" fill="#17171a" stroke="#22c55e" stroke-opacity=".3"/>
    <text x="150" y="795" text-anchor="middle" class="small" font-weight="500">Write to Memory</text>
    <text x="150" y="815" text-anchor="middle" class="small">pgvector • VERIFIED status</text>
    
    <!-- User Response -->
    <rect x="600" y="770" width="200" height="60" rx="10" fill="#17171a" stroke="#ffc53d" stroke-opacity=".5"/>
    <text x="700" y="795" text-anchor="middle" class="label" font-weight="600">VERDICT</text>
    <text x="700" y="815" text-anchor="middle" class="small">False • 96% confidence</text>
    
    <!-- Monitoring -->
    <rect x="1150" y="770" width="200" height="60" rx="10" fill="#17171a" stroke="#6366f1" stroke-opacity=".3"/>
    <text x="1250" y="795" text-anchor="middle" class="small" font-weight="500">Monitoring</text>
    <text x="1250" y="815" text-anchor="middle" class="small">Metrics • Drift • Velocity</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <text x="50" y="35" class="small" font-weight="500">Legend:</text>
    <rect x="120" y="25" width="80" height="18" rx="4" fill="#10b981" fill-opacity=".15" stroke="#10b981" stroke-opacity=".3"/>
    <text x="160" y="37" text-anchor="middle" class="small">ML Models</text>
    <rect x="210" y="25" width="80" height="18" rx="4" fill="#f59e0b" fill-opacity=".15" stroke="#f59e0b" stroke-opacity=".3"/>
    <text x="250" y="37" text-anchor="middle" class="small">Memory</text>
    <rect x="300" y="25" width="80" height="18" rx="4" fill="#3b82f6" fill-opacity=".15" stroke="#3b82f6" stroke-opacity=".3"/>
    <text x="340" y="37" text-anchor="middle" class="small">Live Search</text>
    <rect x="390" y="25" width="60" height="18" rx="4" fill="#a855f7" fill-opacity=".15" stroke="#a855f7" stroke-opacity=".3"/>
    <text x="420" y="37" text-anchor="middle" class="small">RAG</text>
  </g>
</svg>
