name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: ci-only-secret
          SKIP_TRAIN_ON_STARTUP: "true"
          REDIS_ENABLED: "false"
          ENVIRONMENT: test
        run: pytest tests -q

  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every script
        run: find extension -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Validate manifest
        run: |
          node -e '
            const m = require("./extension/manifest.json");
            if (m.manifest_version !== 3) throw new Error("manifest_version must be 3");
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error("bad version " + m.version);
            console.log("manifest ok, version", m.version);
          '

      - name: Production backend is selected
        run: grep -q 'USE_LOCAL_BACKEND = false' extension/env.js

  security:
    name: Security scan (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Bandit
        run: |
          pip install bandit
          bandit -r backend/app -ll -f json -o bandit-report.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
