<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=420">
  <meta name="color-scheme" content="dark">
  <title>Truvanta</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>

  <!-- Sidebar overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="sidebar-logo-text"><svg class="tv-mark" width="18" height="14" viewBox="0 0 40 31" fill="none" aria-hidden="true" focusable="false"><path d="M11.6 9.6V24.6C11.6 27.5 13.2 29.2 16.2 29.2" stroke="#ededef" stroke-width="4"/><path d="M10.4 9.4 19.4 20.6 33.6 7.4" stroke="#0a0a0b" stroke-width="6.6" stroke-linejoin="round"/><path d="M10.4 9.4 19.4 20.6 33.6 7.4" stroke="#ffc53d" stroke-width="4.2" stroke-linejoin="round"/><path d="M0.4 11.4C1.8 5.6 4.6 2.4 9.6 2.4H32.4L26 9.2H10.6C6.4 9.2 3 9.9 0.4 11.4Z" fill="#ededef"/><path d="M0.4 11.4C1.8 5.6 4.6 2.4 9.6 2.4H12.4C8.2 3 5.6 5.4 4.4 9.6 2.8 10 1.4 10.6 0.4 11.4Z" fill="#ffc53d"/><g fill="#ffc53d"><rect x="37.2" y="0.2" width="2.7" height="2.7" rx="0.5"/><rect x="34.2" y="3" width="1.9" height="1.9" rx="0.4"/><rect x="36.3" y="5.8" width="2.1" height="2.1" rx="0.4"/><rect x="34.8" y="10.2" width="2" height="2" rx="0.4" fill-opacity="0.55"/></g></svg><span class="brand-main">Truvanta</span></span>
      </div>
      <button id="close-sidebar-btn" class="icon-btn" aria-label="Close menu" title="Close">
        <span class="material-symbols-outlined ms-16">close</span>
      </button>
    </div>

    <button id="new-chat-sidebar-btn" class="sidebar-new-btn">
      <span class="material-symbols-outlined ms-14">add</span>
      New Chat
    </button>

    <div class="sidebar-section-label" id="sessions-label">Recent chats</div>
    <div id="sessions-list" class="scroll" role="list" aria-labelledby="sessions-label"></div>

    <nav class="sidebar-nav" aria-label="Pages">
      <a id="nav-dashboard" role="link" tabindex="0">
        <span class="material-symbols-outlined ms-16">grid_view</span> Dashboard
      </a>
      <a id="nav-saved" role="link" tabindex="0">
        <span class="material-symbols-outlined ms-16">bookmark</span> Saved
      </a>
      <a id="nav-history" role="link" tabindex="0">
        <span class="material-symbols-outlined ms-16">history</span> History
      </a>
      <a id="nav-settings" role="link" tabindex="0">
        <span class="material-symbols-outlined ms-16">settings</span> Settings
      </a>
    </nav>

    <div class="sidebar-user">
      <div id="sidebar-avatar" class="sidebar-avatar">?</div>
      <div class="sidebar-user-info">
        <div id="sidebar-name" class="u-name">—</div>
        <div id="sidebar-email" class="u-email"></div>
      </div>
      <button id="logout-btn" class="logout-btn" aria-label="Sign out" title="Sign out">
        <span class="material-symbols-outlined ms-16">logout</span>
      </button>
    </div>
  </div>

  <!-- Main shell -->
  <div class="app-shell">
    <header class="app-header">
      <button id="open-sidebar-btn" class="icon-btn" aria-label="Open menu" title="Menu">
        <span class="material-symbols-outlined ms-20">menu</span>
      </button>
      <div class="header-logo">
        <span id="chat-title" class="logo-text"><svg class="tv-mark" width="19" height="15" viewBox="0 0 40 31" fill="none" aria-hidden="true" focusable="false"><path d="M11.6 9.6V24.6C11.6 27.5 13.2 29.2 16.2 29.2" stroke="#ededef" stroke-width="4"/><path d="M10.4 9.4 19.4 20.6 33.6 7.4" stroke="#0a0a0b" stroke-width="6.6" stroke-linejoin="round"/><path d="M10.4 9.4 19.4 20.6 33.6 7.4" stroke="#ffc53d" stroke-width="4.2" stroke-linejoin="round"/><path d="M0.4 11.4C1.8 5.6 4.6 2.4 9.6 2.4H32.4L26 9.2H10.6C6.4 9.2 3 9.9 0.4 11.4Z" fill="#ededef"/><path d="M0.4 11.4C1.8 5.6 4.6 2.4 9.6 2.4H12.4C8.2 3 5.6 5.4 4.4 9.6 2.8 10 1.4 10.6 0.4 11.4Z" fill="#ffc53d"/><g fill="#ffc53d"><rect x="37.2" y="0.2" width="2.7" height="2.7" rx="0.5"/><rect x="34.2" y="3" width="1.9" height="1.9" rx="0.4"/><rect x="36.3" y="5.8" width="2.1" height="2.1" rx="0.4"/><rect x="34.8" y="10.2" width="2" height="2" rx="0.4" fill-opacity="0.55"/></g></svg><span class="brand-main">Truvanta</span></span>
      </div>
      <button id="new-chat-btn" class="icon-btn" aria-label="New chat" title="New chat">
        <span class="material-symbols-outlined ms-18">edit_square</span>
      </button>
    </header>

    <div id="chat-container"></div>

    <div class="input-area">
      <!-- Attachment preview bar -->
      <div id="attach-preview-bar" class="attach-preview-bar" style="display:none">
        <span class="material-symbols-outlined ms-14 attach-preview-icon" id="attach-preview-icon">image</span>
        <span id="attach-preview-name" class="attach-preview-name"></span>
        <button id="attach-remove-btn" class="icon-btn" aria-label="Remove attachment" title="Remove">
          <span class="material-symbols-outlined ms-12">close</span>
        </button>
      </div>

      <div class="input-box">
        <!-- + attach menu -->
        <div class="attach-wrap">
          <button id="attach-btn" class="icon-btn" aria-label="Attach file" aria-haspopup="true" title="Attach file">
            <span class="material-symbols-outlined ms-18">add_circle</span>
          </button>
          <div id="attach-menu" class="attach-menu" style="display:none">
            <label class="attach-menu-item">
              <span class="material-symbols-outlined ms-14">image</span> Image
              <input type="file" id="file-image" accept="image/*" style="display:none">
            </label>
            <label class="attach-menu-item">
              <span class="material-symbols-outlined ms-14">audiotrack</span> Audio
              <input type="file" id="file-audio" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm" style="display:none">
            </label>
            <label class="attach-menu-item">
              <span class="material-symbols-outlined ms-14">picture_as_pdf</span> PDF
              <input type="file" id="file-pdf" accept=".pdf" style="display:none">
            </label>
            <label class="attach-menu-item">
              <span class="material-symbols-outlined ms-14">description</span> Text file
              <input type="file" id="file-txt" accept=".txt,.md,.csv,.doc,.docx" style="display:none">
            </label>
          </div>
        </div>

        <textarea id="input-text" rows="1" aria-label="Message" placeholder="Ask anything or paste a claim…"></textarea>
        <button id="voice-btn" class="icon-btn" aria-label="Voice input" title="Voice input">
          <span class="material-symbols-outlined ms-18">mic</span>
        </button>
        <button id="send-btn" aria-label="Send" title="Send">
          <span class="material-symbols-outlined ms-16">send</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../env.js"></script>
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="websocket_client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
